<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<header class="top">

  <div class="ttl"><h1>Kicker<span>stats</span></h1><div class="sub">1. Männer · Trainingskick 26/27</div></div>
  <button class="sync off" id="sync" aria-label="Aktualisieren"><i></i><span>…</span></button>
  <button class="me-btn" id="me-btn" data-act="whoami" aria-label="Anmeldung">?</button>
</header>

<main id="main"></main>

<nav class="tabbar">
  <button data-act="tab" data-v="home" data-tab="home" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Übersicht</button>
  <button data-act="tab" data-v="players" data-tab="players">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>Spieler</button>

  <button data-act="tab" data-v="games" data-tab="games">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2V5zM17 9h3v10a2 2 0 0 1-2 2"/><path d="M7 9h7M7 13h7M7 17h4"/></svg>Monat</button>
